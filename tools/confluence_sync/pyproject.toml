[project]
name = "confluence-sync-mcp"
version = "0.1.0"
description = "MCP server for syncing local/GitLab docs to Confluence with formatting"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Contributors" }]
keywords = ["mcp", "confluence", "gitlab", "markdown", "docs-sync"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
]
dependencies = [
  "mcp>=1.12.4",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "markdown>=3.7",
]

[project.urls]
Homepage = "https://github.com/<org>/<repo>"
Repository = "https://github.com/<org>/<repo>"
Issues = "https://github.com/<org>/<repo>/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.2",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
]

[project.scripts]
confluence-sync-mcp = "confluence_sync.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_sync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

