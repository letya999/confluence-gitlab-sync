name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and validate versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PY_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("packages/confluence-sync-mcp/pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          NPM_VERSION="$(node -p "require('./packages/confluence-sync-mcp-npm/package.json').version")"
          echo "Tag: $TAG"
          echo "Python package version: $PY_VERSION"
          echo "NPM package version: $NPM_VERSION"
          if [[ "$TAG" != "$PY_VERSION" ]]; then
            echo "Tag version and Python package version mismatch"
            exit 1
          fi
          if [[ "$TAG" != "$NPM_VERSION" ]]; then
            echo "Tag version and npm package version mismatch"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  check-release-config:
    runs-on: ubuntu-latest
    outputs:
      has_pypi_publish: ${{ steps.check.outputs.has_pypi_publish }}
      pypi_mode: ${{ steps.check.outputs.pypi_mode }}
      has_npm_token: ${{ steps.check.outputs.has_npm_token }}
    steps:
      - name: Check release credentials
        id: check
        shell: bash
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_TRUSTED_PUBLISHING: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${PYPI_API_TOKEN:-}" ]]; then
            echo "has_pypi_publish=true" >> "$GITHUB_OUTPUT"
            echo "pypi_mode=token" >> "$GITHUB_OUTPUT"
            echo "PYPI_API_TOKEN is configured."
          elif [[ "${PYPI_TRUSTED_PUBLISHING:-false}" == "true" ]]; then
            echo "has_pypi_publish=true" >> "$GITHUB_OUTPUT"
            echo "pypi_mode=trusted" >> "$GITHUB_OUTPUT"
            echo "PyPI trusted publishing is enabled via repository variable."
          else
            echo "has_pypi_publish=false" >> "$GITHUB_OUTPUT"
            echo "pypi_mode=disabled" >> "$GITHUB_OUTPUT"
            echo "PyPI publish is disabled. Set PYPI_API_TOKEN or PYPI_TRUSTED_PUBLISHING=true to enable it."
          fi
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "has_npm_token=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is configured."
          else
            echo "has_npm_token=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not configured. npm publish job will be skipped."
          fi

  publish-pypi:
    needs:
      - validate-tag-version
      - check-release-config
    if: needs.check-release-config.outputs.has_pypi_publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python distribution
        working-directory: packages/confluence-sync-mcp
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI with API token
        if: needs.check-release-config.outputs.pypi_mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/confluence-sync-mcp/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI with trusted publishing
        if: needs.check-release-config.outputs.pypi_mode == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/confluence-sync-mcp/dist

  publish-npm:
    needs:
      - validate-tag-version
      - check-release-config
    if: needs.check-release-config.outputs.has_npm_token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: packages/confluence-sync-mcp-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
